# OpsPilot CI — the jobs named in docs/milestones.md §M9.
#
# Every command in this file is one that runs in the repository today, at the
# paths and with the flags the README and pyproject.toml document. Nothing here
# is aspirational: a command that was not run locally is a command that fails on
# first push. Where a command cannot run on a developer machine (the Postgres
# service in `verify`), that is stated in the job rather than hidden.
#
# Two workflows, because one of them must run only on demand:
#   * ci.yml      — every push/PR: lint, typecheck, test, verify, mcp-contract,
#                   security, eval-smoke, web-lint, web-typecheck, desktop-check,
#                   desktop-menu, desktop-package, docker-build, web-e2e.
#   * eval-live.yml — workflow_dispatch only; it costs money and is
#                   non-deterministic (docs/evals.md §5), so it is never on push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push supersedes the run it interrupted. Scoped per-ref (and per-workflow) so
# cancelling a feature-branch push does not kill the `main` run, and so two open
# pull requests do not cancel each other. `cancel-in-progress` is on because a
# half-finished run of a *superseded* commit has nothing to say about the new
# one; the concurrency group is what keeps that from being destructive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic, keyless defaults so no job depends on a developer's .env and
  # nothing reaches a network model. `verify` overrides DATABASE_URL per job.
  OPSPILOT_ENV: test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------------- #
  # lint — ruff check over the configured source roots, and ruff format --check.
  #
  # The README documents `ruff check` and pyproject.toml configures
  # src = ["src", "tests", "evals", "mcp_servers"]. Running `ruff check` with no
  # path is the config-driven check; passing `src tests` would narrow it and skip
  # `evals/` and `mcp_servers/`, which are in the configured set -- the same
  # mistake tests/unit/test_mypy_configuration_is_enforced.py exists to catch for
  # mypy, applied to ruff.
  #
  # `ruff format --check` is a second, separate gate, and it is here because M0's
  # acceptance criteria name it ("`ruff check` and `ruff format --check` are
  # clean") and nothing checked it before this revision. The tree at HEAD had 18
  # files the current ruff rev would reformat while `ruff check` was green: the
  # linter is stable across ruff minors, the *formatter* rev is not, so an
  # unpinned `ruff>=0.6` let the definition of "formatted" drift out from under
  # committed code. ruff is now pinned to a minor line in pyproject.toml
  # (`ruff>=0.16.10,<0.17`) so this gate and the pin hold each other.
  # ------------------------------------------------------------------------- #
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check
      - name: The committed artwork is current with its source
        # WHY THIS STEP IS HERE
        # ------------------
        # `desktop/assets/icon.ico`, `web/src/app/favicon.ico` and
        # `docs/assets/logo.png` are build artefacts that live in the
        # repository:
        # `scripts/make_assets.py` generates the icon and the favicon from
        # `docs/assets/icon-source.png` and the wordmark from
        # `docs/assets/logo-source.png`, and `desktop/electron-builder.yml`
        # points the Windows build at the committed `.ico`. Nothing in the
        # build regenerates them, so they drift the moment the artwork
        # changes and nobody reruns the script -- and the drift is invisible
        # in a review, because a binary is not something a diff shows. The
        # failure this prevents is the icon that ships being the badge from
        # three artwork revisions ago, with no symptom anyone can point at.
        #
        # The wordmark was the worse half of it: before this step it had a
        # committed artefact, a reference to it in the README, and neither a
        # source nor a guard -- the icon's own failure mode, one file over.
        #
        # The favicon is the third one, and it is the one that needed the
        # guard most: nothing in the dashboard's source names the file.
        # Next.js's App Router picks up `app/favicon.ico` by the file
        # convention alone, so there is no reference to follow and no
        # compiler to complain. A favicon that is three artwork revisions
        # old is exactly as invisible as the icon was.
        #
        # THE PRECEDENT, AND WHY IT IS CITED
        # ----------------------------------
        # The dashboard's generated client types have exactly this failure
        # mode, and the repository already guards them: `web/scripts/
        # generate-types.mjs --check` regenerates the types into a temporary
        # directory and compares them with the committed file, and
        # `tests/integration/test_web_client_types.py` asserts it by calling
        # that `--check` mode rather than reimplementing the comparison in the
        # test -- because a guard that compares with its own logic tests the
        # guard's logic, not the artefact. `make_assets.py --check` is the same
        # contract for the artwork: it regenerates into a temporary directory
        # and deliberately never writes the file it is checking. A check that
        # repairs the tree it is checking is not a check.
        #
        # The comparison is picture against picture rather than byte against
        # byte, and the difference is load-bearing here. An `.ico` holds PNG
        # frames and a `.png` is a PNG, and what a PNG encoder writes for an
        # image depends on the compressor -- the same pixels at compression
        # levels 6, 7 and 9 come out as 80,707, 77,475 and 75,678 bytes. So
        # the bytes of either artefact depend on the zlib that packed them
        # and on the Pillow that chose the deflate parameters -- Pillow
        # changed those between 11.0.0 and 11.1.0, and the Windows and
        # manylinux wheels bundle different zlibs -- so the bytes of an
        # artefact depend on where it was packed and not only on what it
        # shows. A byte comparison would call an unchanged tree stale, and
        # its remedy -- regenerate the artefact -- would change the file
        # and not the problem.
        #
        # WHY IT IS HERE AND NOT IN `desktop-package`
        # ------------------------------------------
        # `desktop-package` runs on a Windows runner that has no Python
        # environment at all: it builds the Electron shell and the installer.
        # Putting this check there would mean giving that job a second
        # toolchain -- a Python install and Pillow -- to run a check that
        # costs nothing here. This job already installs `.[dev]`, and Pillow
        # is in that extra, so the step is one more command in a job that has
        # the interpreter and the library already.
        run: python scripts/make_assets.py --check

  # ------------------------------------------------------------------------- #
  # typecheck — bare `mypy`, no path argument.
  #
  # The README documents bare `mypy` and tests/unit/test_mypy_configuration_is_enforced.py
  # asserts the documented command carries no positional path. A path here would
  # silently check only that path and ignore [tool.mypy] files = ["src",
  # "mcp_servers", "tests", "evals"] -- which is how eighteen test-file errors
  # once shipped behind a green `mypy --strict src`.
  # ------------------------------------------------------------------------- #
  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy

  # ------------------------------------------------------------------------- #
  # test — the full suite on the two supported interpreters.
  #
  # SQLite in-memory by default: no services, and the postgres-marked tests are
  # reported as skipped (ADR-0004). `verify` is where they actually run, so a
  # skip here is expected and is not a pass.
  # ------------------------------------------------------------------------- #
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      # The web-client drift guard (tests/integration/test_web_client_types.py
      # ::test_client_types_match_the_live_openapi_schema) is a *cross-stack*
      # check: it shells out to `node web/scripts/generate-types.mjs --check`,
      # which does `import "openapi-typescript"`. That package is a devDependency
      # of web/, so it exists only after `npm ci` in web/. Without this step the
      # guard fails with ERR_MODULE_NOT_FOUND on the runner -- `node` is
      # preinstalled, so the test's own `_node_is_available()` does not skip it,
      # but the package it imports is not there. Installing here is what makes
      # the guard's docstring true ("cheap enough to run on every test
      # invocation"): the test stays in the pytest tree and genuinely runs,
      # instead of being moved to a web job or skipped into a vacuous green.
      # `npm --prefix web ci` keeps every Python step at the repo root (no
      # job-level working-directory), and the cache reuses the same
      # web/package-lock.json the web jobs key on -- one lockfile, one source.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dev dependencies (openapi-typescript, for the drift guard)
        run: npm --prefix web ci
      - name: pytest
        run: pytest

  # ------------------------------------------------------------------------- #
  # verify — the Postgres path (docs/adr/0004, docs/milestones.md §M9):
  # migrations, the vector differential test, the vector shared contract and the
  # worker claim's locking clause.
  #
  # §M9 also names "worker concurrency". The claim's *locking clause* runs here:
  # `tests/integration/test_worker_claim_postgres.py` starts two claimants against
  # the service container and asserts `FOR UPDATE SKIP LOCKED` separates them (the
  # step below, named by node id and asserted PASSED like the vector tests). What
  # still does *not* hold is the end-to-end guarantee the ADR advertises -- two
  # workers, one database, no run driven twice -- because `claim_next` releases its
  # lock with its own `SELECT`; that boundary is characterised in the same file and
  # recorded in docs/limitations.md §2 and §8, not asserted here as if it held.
  #
  # A real pgvector service container. `alembic upgrade head` runs first because
  # the differential test asserts against the migrated schema, and ADR-0004 makes
  # "a migration valid in SQLite but not Postgres" a risk this job is the only
  # mitigation for.
  #
  # A skip here must not read as a pass. Both postgres-marked vector store tests
  # skip when no Postgres is reachable (so the local suite is green without one),
  # which means a misconfigured URL would produce a green *skipped* run that
  # proved nothing. Each is therefore named by node id and asserted PASSED,
  # rather than run under `-m postgres` and accepted with whatever exit code
  # pytest gives an all-skip run. This is the property ADR-0004 names the
  # differential test as the mitigation for, held for both of them.
  # ------------------------------------------------------------------------- #
  verify:
    name: verify (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector's official image, which ships the `vector` extension the
        # migration runs `CREATE EXTENSION IF NOT EXISTS vector` for. A plain
        # postgres image would fail the migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports:
          - 5432:5432
        # The differential test connects as soon as the job starts; without a
        # health check it can win the race against the server.
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL drives `alembic upgrade head` and opspilot.settings.
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
      # The postgres-marked tests (test_citations.py, test_vector_stores.py) read
      # OPSPILOT_DATABASE_URL to decide whether Postgres is reachable. Both names
      # are set because they are read by different layers and the tests skip on
      # the second.
      OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # Same cross-stack drift guard as the `test` job: the final step below
      # runs `pytest tests/integration tests/agent`, which collects
      # test_web_client_types.py; its schema-drift check needs the
      # `openapi-typescript` devDependency of web/. Installing the web deps here
      # (before any test runs) is what lets that guard execute against the real
      # dialect instead of dying on a missing Node package. See the `test` job
      # for the full rationale.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dev dependencies (openapi-typescript, for the drift guard)
        run: npm --prefix web ci
      - name: Migrations (alembic upgrade head)
        run: alembic upgrade head
      - name: Verify migrations reached head
        run: alembic current
      - name: Vector differential test against the real pgvector store
        # The differential test (tests/integration/test_citations.py) does real
        # work: it creates the pgvector schema, upserts identical chunks into a
        # real PgVectorStore and an InMemoryVectorStore, queries both with one
        # vector, and asserts the top-5 ids and scores agree to 4 dp. It skips
        # when no Postgres is reachable -- which is the whole reason this job
        # exists -- so a green run is only meaningful if it PASSED.
        #
        # It is named by node id, NOT selected with `-m postgres`, because there
        # are exactly two postgres-marked pgvector tests and each is asserted to
        # have *run* by its own step. Naming them keeps a skip in one from
        # hiding behind a pass in the other -- which is what used to happen:
        # tests/unit/test_vector_stores.py carried two hardcoded `pytest.skip`
        # stubs that reported SKIPPED on every machine, CI included. Both of its
        # postgres tests now do real work; the duplicated differential one was
        # deleted rather than left to read as coverage (ADR-0004).
        run: |
          set -o pipefail
          pytest tests/integration/test_citations.py::test_pgvector_and_memory_stores_agree -rA -v 2>&1 | tee /tmp/diff.txt
          echo "--- assertion ---"
          grep -qE "test_pgvector_and_memory_stores_agree .*PASSED" /tmp/diff.txt \
            || { echo "::error::the vector differential test did not PASS. A SKIPPED result here means OPSPILOT_DATABASE_URL did not reach pytest, or the pgvector service was unreachable -- which is exactly the failure this job must not read as green (ADR-0004)."; exit 1; }
      - name: PgVectorStore shared-contract test against the real pgvector store
        # The other half of the pgvector coverage ADR-0004 names: the *shared
        # contract* -- ranks dense from one, and `upsert` as a replacement keyed
        # on (document_id, ordinal) -- asserted on a real PgVectorStore and not
        # only on the in-memory one. It reads OPSPILOT_DATABASE_URL exactly as
        # the differential test does, so a SKIP here means the variable did not
        # reach pytest or the service was unreachable -- the failure this job
        # must not read as green. It is asserted PASSED, and the whole marked
        # selection is asserted skip-free, because both postgres-marked vector
        # store tests now do real work and neither has a local-only excuse.
        run: |
          set -o pipefail
          pytest tests/unit/test_vector_stores.py -m postgres -rA -v 2>&1 | tee /tmp/vs.txt
          echo "--- assertion ---"
          grep -qE "test_pgvector_store_satisfies_shared_contract .*PASSED" /tmp/vs.txt \
            || { echo "::error::the PgVectorStore shared-contract test did not PASS. A SKIPPED result here means OPSPILOT_DATABASE_URL did not reach pytest, or the pgvector service was unreachable -- which is exactly the failure this job must not read as green (ADR-0004)."; exit 1; }
          if grep -q "SKIPPED" /tmp/vs.txt; then
            echo "::error::a postgres-marked vector-store test skipped in the pgvector job. Both of them do real work now; a skip means the environment did not reach pytest."
            exit 1
          fi
          # The match is anchored on `::` so it counts *test names*, not
          # collected lines. The refusal-guard file
          # (test_pgvector_target_is_never_destroyed.py) is named for pgvector
          # but proves a safety property, not a store behaviour, and a pattern
          # that matched file paths counted its three tests as pgvector
          # behaviour tests and turned this guard red on a file that belongs.
          count=$(pytest -m postgres --collect-only -q 2>&1 | grep -c "::test_pgvector")
          echo "postgres-marked pgvector behaviour tests collected: $count"
          [ "$count" -eq 2 ] || { echo "::error::expected exactly 2 pgvector behaviour tests under -m postgres (the differential in test_citations.py + the shared-contract test in test_vector_stores.py); got $count. A second copy of the differential was deleted from test_vector_stores.py precisely so that one property has one home -- if this number changed, the ADR-0004 text and this guard must change with it."; exit 1; }
      - name: Two-worker claim test against the real PostgreSQL
        # The `FOR UPDATE SKIP LOCKED` claim, exercised where it matters. SQLite
        # has no such clause, so `tests/integration/test_worker_claim.py` can only
        # cover the claim *predicate* (which the `test` job already does); the
        # locking clause that makes two workers take different rows is a
        # Postgres-only property and until this test existed it had never been
        # executed anywhere (docs/limitations.md §2 and §8, ADR-0004's divergence
        # table). `claim_next`'s own docstring used to name a two-worker
        # `@pytest.mark.postgres` test that did not exist; this step is the job
        # that makes that sentence true and keeps it true.
        #
        # It reads OPSPILOT_DATABASE_URL exactly as the two pgvector tests above
        # do, so the service container and the env block already set for this job
        # are the whole requirement -- no second database, no second source. It
        # is named by node id and asserted PASSED for the same reason the vector
        # tests are: it skips cleanly where no Postgres is reachable (ADR-0004),
        # and a SKIPPED result here means the environment did not reach pytest or
        # the service was unreachable -- a green *skip* would read as coverage the
        # run did not have. The `needs-empty` caveat the pgvector tests carry
        # applies here too: the test lays the schema down through the same guard
        # (`tests/_pgvector_target.guarded_pg_schema`) and refuses a database that
        # holds rows, so pointing this job at a populated database fails loudly
        # rather than destroying it.
        run: |
          set -o pipefail
          pytest tests/integration/test_worker_claim_postgres.py -rA -v 2>&1 | tee /tmp/claim.txt
          echo "--- assertion ---"
          grep -qE "test_a_held_claim_makes_the_next_claimant_skip_to_another_row .*PASSED" /tmp/claim.txt \
            || { echo "::error::the two-worker claim test did not PASS. A SKIPPED result here means OPSPILOT_DATABASE_URL did not reach pytest, or the pgvector service was unreachable -- which is exactly the failure this job must not read as green (ADR-0004). A FAILED result means the FOR UPDATE SKIP LOCKED claim no longer separates two workers."; exit 1; }
          if grep -q "SKIPPED" /tmp/claim.txt; then
            echo "::error::a postgres-marked worker-claim test skipped in the pgvector job. They do real work against the service container; a skip means the environment did not reach pytest."
            exit 1
          fi
      - name: Worker and integration tests against the configured database
        # The worker-claim tests build their own SQLite factory
        # (test_worker_claim.py), so they pass without Postgres and are already
        # covered by the `test` job. This step re-runs the integration and agent
        # suites with DATABASE_URL pointing at the service, so anything that
        # reads the configured URL is exercised against the real dialect. The
        # postgres-marked tests are excluded here -- they ran, and were asserted
        # to have passed, in the step above; re-selecting them would run the
        # differential test a second time.
        env:
          OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot
        run: pytest tests/integration tests/agent -q -m "not postgres"

  # ------------------------------------------------------------------------- #
  # mcp-contract — the MCP servers register exactly the tools docs/mcp-contracts.md
  # names, with the contract's names. A rename that both the server and its own
  # test agreed on (the M2 bug) is caught here against the spec, not the code.
  # ------------------------------------------------------------------------- #
  mcp-contract:
    name: mcp-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: MCP contract tests
        run: pytest tests/integration/test_mcp_contract_names.py

  # ------------------------------------------------------------------------- #
  # security — the permission registry against its literal, the approval-bypass
  # adversaries, the invariants, and the prompt-injection boundary. The four
  # invariant queries must return 0 (docs/tool-permissions.md §5).
  # ------------------------------------------------------------------------- #
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Security suite
        run: pytest tests/security

  # ------------------------------------------------------------------------- #
  # eval-smoke — the harness runs end to end on the fake provider, and the
  # refusal is exercised rather than bypassed (docs/evals.md §5, §M8/M9).
  #
  # The job runs WITHOUT `--allow-fake-scores`, deliberately. Passing that flag
  # unconditionally would defeat the documented property that a scripted
  # provider's accuracy is never printed as if it were a model result. So the
  # assertion is the *refusal*: the run exits 0 and prints
  #   fake provider — harness check only, not a model result
  # and no metric table. Exit 0 also proves the gate held, because the runner
  # exits non-zero when `unsafe execution count` is anything but 0.
  # ------------------------------------------------------------------------- #
  eval-smoke:
    name: eval-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run 8 representative cases on the fake provider
        run: |
          set -o pipefail
          output=$(python -m opspilot.evals run --provider fake --limit 8 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::the smoke run exited $status (a non-zero exit means the unsafe-execution gate tripped, or the run could not execute)"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q "fake provider"; then
            echo "::error::expected the fake-provider refusal; the harness printed a table instead ('--allow-fake-scores' must not be passed here)"
            exit 1
          fi
          if printf '%s' "$output" | grep -q "unsafe execution count"; then
            echo "::error::a metric table was printed for the fake provider"
            exit 1
          fi

  # ------------------------------------------------------------------------- #
  # web-lint / web-typecheck — the dashboard's own checks (docs/milestones.md §M7:
  # "eslint and tsc --noEmit clean in CI"). `npm ci` because package-lock.json is
  # committed; `npm install` would be free to drift the lockfile.
  # ------------------------------------------------------------------------- #
  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: eslint
        run: npm run lint

  web-typecheck:
    name: web-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  # ------------------------------------------------------------------------- #
  # desktop-check — the Electron shell's own gates (docs/phase2-plan.md P2-D1).
  #
  # WHY A SEPARATE PACKAGE AND THEREFORE A SEPARATE JOB
  # -------------------------------------------------
  # `web/` is the Next.js application: `web/package.json` is its manifest,
  # `web/package-lock.json` is the lockfile `web-lint` and `web-typecheck` run
  # `npm ci` against, and adding Electron to it would mean every push downloads a
  # Chromium runtime and every `web` gate lints and type-checks code that is not
  # the web app. The shell lives in `desktop/` with its own manifest, lockfile,
  # tsconfig and ESLint config; the repository has two Node packages and this is
  # the job for the second one. Nothing about `web-lint` or `web-typecheck`
  # changes: neither reads a file under `desktop/`.
  #
  # WHAT THIS JOB DOES NOT RUN, AND WHY
  # ----------------------------------
  # Not `npm run test:shell`. That project launches the real Electron app, which
  # needs a display (`xvfb-run` on Linux) AND brings up the full Compose stack --
  # a database, migrations, an API and a worker -- on every push. Its evidence
  # belongs in a job that can afford those minutes, and `desktop/e2e/shell.spec.ts`
  # skips cleanly with a named reason on a runner that cannot open a window.
  #
  # `npm run test:lifecycle` is the half that costs nothing and runs here: it
  # drives `src/lifecycle/` from a table of answers, with no Electron, no Docker,
  # and no browser binary -- so no `playwright install` step is needed for it.
  # ------------------------------------------------------------------------- #
  desktop-check:
    name: desktop-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: Lifecycle tests (no Electron, no Docker, no browser)
        run: npm run test:lifecycle

  # ------------------------------------------------------------------------- #
  # desktop-menu — the native menu, in a real Electron, on a real cookie.
  #
  # WHY A SEPARATE JOB AND NOT A STEP IN desktop-check
  # -------------------------------------------------
  # `desktop-check` is the job that has to stay cheap: it runs on every push
  # and it needs no Electron binary, no browser, and no display. This job needs
  # all three. Keeping them apart means the expensive setup is paid for by the
  # one job that needs it, and a failure in the Electron setup cannot take the
  # cheap gates down with it.
  #
  # WHAT THIS JOB IS THE ONLY PROOF OF
  # -------------------------------
  # The menu's *policy* — what it says, in which language — is asserted by
  # `e2e/menu.spec.ts` in the `lifecycle` project, which runs in
  # `desktop-check` and needs nothing. But the policy is only half of it. The
  # other half is the claim the whole feature rests on:
  #
  #     the main process can read the `httpOnly` locale cookie the dashboard
  #     wrote, and rebuild the real application menu from it.
  #
  # That is a claim about Electron's cookie store and Electron's `Menu`, and
  # no fake of either proves it. `e2e/menu-electron.spec.ts` writes a cookie
  # into a real session's store and reads the real application menu back. It
  # is also the only test that proves the start-up path — "the application
  # opens in the language the operator chose last time" — which needs a
  # *persistent* cookie and a second launch against the same profile.
  #
  # Without this job, none of that is executed anywhere except on a developer's
  # machine, and a change to `src/menu.ts` that broke it would be merged on the
  # strength of a policy test that cannot see the break.
  #
  # WHY A DISPLAY, AND WHY Xvfb
  # --------------------------
  # Electron on Linux needs an X display to start, even for an application that
  # opens no window: Chromium's browser process chooses its Ozone platform
  # before the app's main script runs, so there is no point at which "we never
  # make a window" could have mattered. The harness in
  # `e2e/fixtures/menu-harness.mjs` therefore runs under `xvfb-run`, which
  # provides a virtual framebuffer rather than a real one.
  #
  # The alternative — `--ozone-platform=headless` — works in Electron 44 but is
  # not documented in that version, and Electron's own guidance for testing
  # without a display is still a virtual one. `xvfb-run` is also the mechanism
  # the shell spec's docstring already names.
  #
  # WHY A SKIP IS A FAILURE HERE
  # -----------------------------
  # `e2e/menu-electron.spec.ts` skips cleanly when the machine cannot open a
  # window, which is right on a developer's machine and wrong in CI: a green
  # *skipped* run would mean the job proved nothing while reporting success.
  # This is the same rule the `verify` job applies to its postgres-marked
  # tests (ADR-0004's divergence table): a skip there means the environment
  # did not reach the test, and an environment that did not reach the test is
  # a failure, not a pass. The assertion below is what makes that true.
  # ------------------------------------------------------------------------- #
  desktop-menu:
    name: desktop-menu (native menu in a real Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: npm ci
      - name: Download the Electron binary
        # `electron@44` has no `postinstall` — the download became lazy
        # (electron/electron#49328), so `npm ci` leaves `node_modules/electron`
        # without a binary and the first `require("electron")` would fetch it
        # from inside the test worker, where a network failure is a confusing
        # test error rather than a named step failure.
        #
        # `npx install-electron --no` is the package's own binary for this
        # (`node_modules/electron/package.json` declares `install-electron` ->
        # `install.js`). The `--no` stops npx from fetching the unrelated
        # `install-electron` package published on npm under the same name.
        run: npx install-electron --no
      - name: Install Xvfb and the Electron runtime libraries
        # `npx playwright install --with-deps chromium` is NOT used here: it
        # installs the libraries *Chromium* needs, and Electron's list differs
        # — it links GTK3 and NSS directly, and Chromium's list has no GTK3 at
        # all. This is the union of electron-builder's own `.deb` dependency
        # list and the X libraries a Chromium process opens.
        #
        # The `t64` suffixes are Ubuntu 24.04's renamed packages. They are
        # written out rather than relied on as virtual-package aliases,
        # because `libasound2` is provided by *two* packages on noble
        # (`libasound2t64` and universe's `liboss4-salsa-asound2`) and apt
        # refuses to pick between them: installing the bare name fails with
        # "Package 'libasound2' has no installation candidate". Measured in an
        # ubuntu:24.04 container, which is what this runner image is.
        #
        # `libgl1-mesa-dri` is a *Recommends* of `xvfb`, and
        # `--no-install-recommends` below would otherwise leave X without a GLX
        # implementation.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb \
            libgl1-mesa-dri \
            libnss3 \
            libnspr4 \
            libgtk-3-0t64 \
            libnotify4 \
            libsecret-1-0 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libuuid1 \
            libatspi2.0-0t64 \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libdbus-1-3 \
            libgbm1 \
            libdrm2 \
            libglib2.0-0t64 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libexpat1 \
            libudev1 \
            libvulkan1 \
            fonts-liberation
      - name: Check the Electron binary is complete
        # `ldd` on the binary lists every shared library it opens. A missing
        # one shows up here as "not found" — which is a clearer failure than
        # the test skipping because Electron could not start, and it names the
        # library to install. The `|| true` is deliberate: `ldd` exits non-zero
        # when *anything* is missing, and the message is in its output, not in
        # its exit code.
        run: |
          set -o pipefail
          ldd node_modules/electron/dist/electron | tee /tmp/ldd.txt | grep "not found" \
            && { echo "::error::the Electron binary is missing shared libraries. Add them to the apt list in this job:"; grep "not found" /tmp/ldd.txt; exit 1; } \
            || echo "every shared library the Electron binary opens is present"
      - name: Menu tests in a real Electron
        # `npm run test:menu` builds `dist/` first, because the spec loads the
        # *compiled* `dist/menu.js` — the thing that ships — rather than
        # reimplementing it. `xvfb-run -a` gives it a display; `-a` picks a
        # free server number so a runner with something else on :99 does not
        # collide.
        #
        # `set -o pipefail` is what makes `| tee` safe: without it the step's
        # status is `tee`'s, and a failing test would leave this step green.
        run: |
          set -o pipefail
          xvfb-run -a npm run test:menu 2>&1 | tee /tmp/menu.txt
      - name: Assert the menu tests really ran
        # The job exists to prove a thing Electron can only prove by running.
        # A skip here means Electron did not start, which is the environment
        # failing to reach the test — and that is a failure, not a pass.
        #
        # The count is asserted as two because that is how many tests the
        # `menu` project has: one that moves the menu with the cookie, and one
        # that opens the application in the language chosen last time. A
        # project that lost a test would otherwise look like a project that
        # passed.
        run: |
          set -o pipefail
          if grep -qE "^\s*[0-9]+ skipped" /tmp/menu.txt; then
            echo "::error::a menu test skipped in the desktop-menu job. The job exists to prove that a real Electron reads the locale cookie and rebuilds the real menu; a skip means Electron did not start, which is the environment failing to reach the test. A green skipped run would report success while proving nothing."
            exit 1
          fi
          passed=$(grep -oE "[0-9]+ passed" /tmp/menu.txt | tail -1 | grep -oE "^[0-9]+")
          echo "menu tests passed: ${passed:-0}"
          [ "${passed:-0}" -eq 2 ] || { echo "::error::expected 2 menu tests to pass (the cookie-driven menu, and the application starting in the language chosen last time); got ${passed:-0}. A lower number means a test was lost or skipped."; exit 1; }

  # ------------------------------------------------------------------------- #
  # desktop-package — the Windows installer, built and checked on every push.
  #
  # WHY THIS JOB EXISTS
  # -------------------
  # `desktop/e2e/packaged-posture.spec.ts` is the only check that the *shipped*
  # artefact satisfies A1–A3: the packaged compose file binds to loopback, the
  # package carries no credential, and the security policy inside `app.asar` is
  # the source policy (docs/phase2-plan.md §P2-D3: "the packaged app is checked
  # against A1–A3 the same way the dev stack is").
  #
  # Until this job existed, that check ran only on a Windows machine that had
  # locally built the package, and was invisible to every push: `electron-builder`
  # appeared nowhere in `.github/workflows/`, so no CI job built the package at
  # all. The check was not wrong — it was never reached. The claim in the plan
  # was a manual claim with a spec attached to it, not a gate.
  #
  # WHY A WINDOWS RUNNER
  # --------------------
  # The artefact is a Windows program. `electron-builder --win --x64` produces
  # `OpsPilot.exe` and a `resources/` tree, and `packaged-posture.spec.ts`
  # skips on anything that is not `win32` — it reads a Windows path layout and
  # an asar archive. A Linux runner cannot run the spec, and a Linux container
  # cannot run the Windows binary either: Wine would be a different machine
  # from the one the package ships to, which is the one thing this check is
  # about. `windows-latest` is GitHub-hosted, so this costs no self-hosted
  # infrastructure, and it is the honest platform — the package is built for
  # Windows and checked on Windows.
  #
  # THE ICON, WHICH IS A SEPARATE FILE AND THE SAME JOB
  # ---------------------------------------------------
  # The shell's Windows icon is artwork: `docs/assets/icon-source.png` is
  # resampled into `desktop/assets/icon.ico` by
  # `scripts/make_assets.py`, and `electron-builder` embeds that file
  # into the executable. The `lint` job already proves the first half —
  # `make_assets.py --check` says the committed `.ico` is the artwork — but
  # nothing proved the second half, that the `.ico` is in the executable at
  # all. The symptom of that not being so is a user looking at the previous
  # icon, with no error anywhere: the artefact is gitignored, so it is not in
  # a diff, and the icon is a binary, so it is not in a review.
  #
  # `desktop/e2e/packaged-posture-icon.spec.ts` reads the built
  # `OpsPilot.exe` and asserts that its group icon lists the ten sizes the
  # artwork is resampled to, that every one of them is backed by a real icon
  # resource holding the committed icon's bytes, and that Windows itself pulls
  # the committed 32-pixel frame out of the executable. The PE resource
  # directory is read in Node, with nothing installed: `desktop/package.json`
  # has no production dependency and deliberately so, and a checker that
  # needed a library would mean adding one or installing it in this job alone.
  #
  # It is a separate file, and the file is named so that the filter in step 3
  # picks it up: `packaged-posture` matches the *file path*, and a file
  # without it would run only in the Linux `desktop-check` job, where it
  # skips. The count assertion in step 4 is the second line of defence — a
  # renamed file would leave five checks, and five is not six.
  #
  # WHAT THE JOB DOES
  # -----------------
  #  1. `npm ci` in `web/` and in `desktop/`. The dashboard's dependencies are
  #     needed because `npm run package:dir` builds the Next.js application
  #     first (`build:web`): the installer ships a *built* dashboard and does
  #     not build one on the target machine — `scripts/stage-stack.mjs` says so
  #     and fails loudly if the standalone tree is missing.
  #  2. `npm run package:dir` — the same script a developer runs. `--dir` builds
  #     the unpacked tree (`release/win-unpacked`) and not the NSIS installer,
  #     and that tree is what the spec reads and what the installer is made of.
  #  3. `npx playwright test --project=lifecycle packaged-posture` — the specs
  #     themselves, in the project that needs no Electron, no display and no
  #     Docker. The filter is matched against the file path, so it selects
  #     `packaged-posture.spec.ts` and `packaged-posture-icon.spec.ts`.
  #  4. An assertion that the run was not a skip, and that it ran all six
  #     checks. A green *skipped* run would mean the job proved nothing while
  #     reporting success — the same rule the `desktop-menu` job applies to a
  #     skipped Electron test and the `verify` job applies to a skipped
  #     postgres-marked test (ADR-0004).
  #
  # `OPSPILOT_PACKAGED_REQUIRED=1` is what turns the spec's skips into
  # failures. On a developer's machine `desktop/release/` does not exist, and a
  # skip that names why is the honest answer; here the job built the package
  # one step earlier, so a skip means the build did not produce what was asked
  # for, and a failure is the only honest report of that.
  #
  # `OPSPILOT_OPERATOR_TOKEN` is a disposable value, not a secret: it is never
  # a real credential, and it exists so the A3 check has a token to look for.
  # It is set for the *build* as well as for the test, because that is the
  # interesting case — a token in the build environment is the one most likely
  # to be embedded in the artefact, and the check asserts that the value which
  # was in the environment while the package was built appears in no packaged
  # file.
  # ------------------------------------------------------------------------- #
  desktop-package:
    name: desktop-package (the Windows artefact)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        # Git Bash rather than PowerShell, so the pipe-and-assert steps below
        # read like the ones in the `desktop-menu` job. GitHub's bash shell
        # already runs with `-e -o pipefail`; the explicit `set` is kept so the
        # intent is readable at the point it matters.
        shell: bash
    env:
      # A disposable token, so the A3 check has something to look for. Not a
      # credential: the package is built and inspected on a disposable runner
      # and the value is never printed.
      OPSPILOT_OPERATOR_TOKEN: ci-disposable-token-not-a-secret
      # Tells `packaged-posture.spec.ts` that the artefact is required, so a
      # missing one is a failure and not a skip.
      OPSPILOT_PACKAGED_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Both lockfiles, because the job installs both packages: the shell
          # and the dashboard it packages.
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install the dashboard's dependencies
        working-directory: web
        run: npm ci
      - name: Install the shell's dependencies
        run: npm ci
      - name: Start from an empty output directory
        # The packaged compose file must be the repository's and not a stale
        # copy -- `packaged-posture.spec.ts` asserts exactly that, and the
        # reason it can is that the build starts from nothing. A fresh runner
        # has no `release/` to remove; a re-run on a persistent one starts from
        # an empty directory rather than from the last job's package.
        run: rm -rf release
      - name: Build the Windows package
        # `package:dir` is `build:web && build && stage && electron-builder
        # --win --x64 --dir`. The first three produce the standalone dashboard
        # and the runtime tree the installer ships; the last one writes
        # `release/win-unpacked`, which is the artefact the next step reads.
        run: npm run package:dir
      - name: Check the packaged artefact against A1–A3, and against the icon it ships
        # `set -o pipefail` is what makes the `| tee` safe: without it the
        # step's status would be `tee`'s, and a failing check would leave this
        # step green.
        #
        # The filter is matched against the file path, so it selects
        # `packaged-posture.spec.ts` (A1, A3 and D3) and
        # `packaged-posture-icon.spec.ts` (the Windows icon) — the latter
        # because its name carries the same words, which is what puts it in
        # this job rather than only in the Linux one.
        run: |
          set -o pipefail
          npx playwright test --project=lifecycle packaged-posture 2>&1 | tee /tmp/posture.txt
      - name: Assert the check really ran
        # The job exists to prove a thing about the package it just built. A
        # skip here means the package was not there to be checked — which is
        # the environment failing to reach the test, and that is a failure,
        # not a pass.
        #
        # The count is asserted as six because that is how many checks the
        # run has: two for A1 (the loopback bindings, and the packaged compose
        # file being the repository's and not a stale copy), two for A3 (no
        # dotenv file in the package, and the build's own token in no packaged
        # file), one for D3 (the security policy inside `app.asar`), and one
        # for the Windows icon (the executable's group icon lists the ten
        # sizes the artwork is resampled to, each is backed by an icon
        # resource holding the committed icon's bytes, and Windows itself
        # pulls the committed 32-pixel frame out of the executable). A
        # project that lost a test would otherwise look like a project that
        # passed.
        run: |
          set -o pipefail
          if grep -qE "^\s*[0-9]+ skipped" /tmp/posture.txt; then
            echo "::error::a packaged-artefact check skipped in the desktop-package job. The job built the package one step earlier, so a skip means the build did not produce what was asked for -- a green skipped run would report success while proving nothing."
            exit 1
          fi
          passed=$(grep -oE "[0-9]+ passed" /tmp/posture.txt | tail -1 | grep -oE "^[0-9]+")
          echo "packaged-artefact checks passed: ${passed:-0}"
          [ "${passed:-0}" -eq 6 ] || { echo "::error::expected 6 packaged-artefact checks to pass (A1's two, A3's two, D3's one, and the Windows icon's one); got ${passed:-0}. A lower number means a check was lost or skipped."; exit 1; }
      - name: Assert the package was actually built
        # The assertion the spec cannot make for itself: the artefact is a
        # build output, and a job that quietly built nothing and then checked
        # nothing would be green.
        run: |
          set -o pipefail
          for artefact in \
            release/win-unpacked/OpsPilot.exe \
            release/win-unpacked/resources/app.asar \
            release/win-unpacked/resources/stack/docker-compose.yml; do
            if [ ! -f "$artefact" ]; then
              echo "::error::$artefact is missing. The Windows package was not built."
              exit 1
            fi
            echo "found $artefact"
          done

  # ------------------------------------------------------------------------- #
  # docker-build — builds the Compose stack and proves it comes up
  # (docs/milestones.md §M9: "docker compose up brings up api, worker, web,
  # postgres, three MCP servers").
  #
  # The Compose file and both Dockerfiles EXIST as of this revision
  # (docker-compose.yml, Dockerfile, web/Dockerfile). The job is written against
  # what docker-compose.yml actually declares, which is NOT everything §M9 lists:
  # the file has postgres, migrate, api, worker and web, and deliberately NO MCP
  # server services -- the three servers are stdio and the gateway builds them
  # in-process, so a container for each would start and then block on stdin
  # (the file's own closing comment records this as a known §M9 gap). The job
  # therefore does not assert three MCP services; it asserts the stack the file
  # declares builds, starts, and reaches a ready API.
  #
  # `OPSPILOT_OPERATOR_TOKEN` is mandatory: Compose uses the `:?` form, so with
  # the variable unset `docker compose` refuses to render the file at all --
  # including for `build`. A throwaway value is set here. It is NOT a secret
  # (the API is reached only over the loopback port on a disposable runner) and
  # it is never printed.
  # ------------------------------------------------------------------------- #
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    env:
      # A disposable token, only to satisfy Compose's `:?` render guard. Not a
      # credential: no real deployment uses it and nothing logs it.
      OPSPILOT_OPERATOR_TOKEN: ci-disposable-token-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - name: Build the Compose stack
        run: |
          if [ ! -f docker-compose.yml ] && [ ! -f docker-compose.yaml ] && [ ! -f compose.yml ] && [ ! -f compose.yaml ]; then
            echo "::error::no compose file at the repository root (docker-compose.yml / compose.yaml). docs/milestones.md §M9 requires 'docker compose up' to bring up the stack."
            exit 1
          fi
          docker compose config --quiet
          docker compose build --pull
      - name: Confirm the stack comes up and the API is ready
        run: |
          # `--wait` blocks until every service with a healthcheck reports
          # healthy (or the timeout fires), which is what "up" means for this
          # stack: postgres healthy, migrate exited 0, api healthy, worker on.
          docker compose up -d --wait --wait-timeout 180
          # Belt and braces: the api's own healthcheck keys on /ready (matching
          # docker-compose.yml), so a 200 here means the database is reachable
          # and alembic_version is at head.
          curl -fsS http://localhost:8000/ready >/dev/null
          echo "api /ready answered"
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------------- #
  # web-e2e — the golden path, walked in a real browser against the real stack
  # (docs/milestones.md §M7: "The golden path is walkable in a browser start to
  # finish").
  #
  # `web/e2e/golden-path.spec.ts` drives postgres + migrate + api + worker
  # (Compose) plus the Next.js dashboard, and clicks through the walkthrough:
  # reindex on Knowledge, submit the README's ticket on Tickets, follow the run
  # to its trace screen, click Approve on Approvals, and assert the terminal
  # status and that exactly one transaction (TX-88219) was refunded -- asked of
  # the billing MCP server, not of the run's own status. Nothing here calls the
  # API directly; a `fetch` would defeat the criterion.
  #
  # WHY THIS JOB IS ON PUSH, UNLIKE eval-live
  # -----------------------------------------
  # eval-live is dispatch-only because it costs money and is non-deterministic.
  # This job spends nothing (MODEL_PROVIDER=fake, no key, no network model) and
  # is deterministic (a scripted replay, a fixed seed), so it belongs on every
  # push: it is the regression guard for the one M7 criterion no other job could
  # reach. `docker-build` proves the stack comes up but drives no run; this
  # drives one, through the UI.
  #
  # IT CANNOT RED AN INFRASTRUCTURE ABSENCE. `web/e2e/stack.ts` skips cleanly
  # when `docker info` fails (ADR-0004's habit: the skip names Docker as the
  # reason) -- so a runner with no working Docker reports SKIPPED, not FAILED.
  # A stack that Docker was reachable enough to attempt and then could not bring
  # up is a real failure (a green skipped run there would prove nothing), which
  # is the one red this job is allowed to produce beyond a genuine assertion
  # failure. The runner's Docker is already exercised by `docker-build` above,
  # so the image pulls are not a new source of flakiness.
  #
  # The dashboard is run with `node .next/standalone/server.js` (web/next.config.ts
  # sets `output: "standalone"`) rather than as the compose `web` service: the
  # compose `web` container cannot reach the API from inside itself, because
  # `web/src/lib/api/client.ts` reads `NEXT_PUBLIC_API_BASE_URL` for server-side
  # fetches too and `localhost:8000` inside the container is the container. See
  # `web/e2e/stack.ts`'s module docstring for the full diagnosis. That is a
  # product wiring defect this test reports rather than fixes.
  # ------------------------------------------------------------------------- #
  web-e2e:
    name: web-e2e (browser golden path)
    runs-on: ubuntu-latest
    env:
      # A disposable token, only to satisfy Compose's `:?` render guard. Not a
      # secret: the stack is reached over loopback on a disposable runner.
      OPSPILOT_OPERATOR_TOKEN: ci-disposable-token-not-a-secret
      # The deterministic provider the golden path runs on. No key, no network.
      MODEL_PROVIDER: fake
      OPSPILOT_FAKE_SCENARIO: duplicate_charge
      EMBEDDING_PROVIDER: local
      RETRIEVAL_MIN_SCORE: "0.22"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install the Playwright chromium (with OS deps)
        run: npx playwright install --with-deps chromium
      - name: Walk the golden path in a browser
        # The spec starts the stack itself (compose down -v, up postgres/migrate/
        # api/worker, next build, node .next/standalone/server.js) and tears it
        # down after, so no step here manages Docker. A failure leaves the
        # Playwright trace/screenshot under web/test-results/ for the upload.
        run: npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: web/test-results/
          if-no-files-found: ignore
      - name: Capture the stack's own logs on failure
        if: failure()
        working-directory: .
        # READ THIS BEFORE TRUSTING THE OUTPUT. On a failure *inside a test*, this
        # step has nothing to show, and that is expected rather than a mistake:
        # `web/e2e/stack.ts` runs `docker compose down -v` in `afterAll`, which
        # Playwright runs whether the test passed or failed, and
        # `web-service.spec.ts` ends the run the same way. So the containers the
        # golden-path failure needs to be explained by are already gone by the
        # time the workflow gets here -- the logs that failure actually needs are
        # written to web/test-results/compose-logs/ from inside the Playwright
        # process BEFORE that teardown, and ride along in the artefact uploaded
        # above.
        #
        # What this step does catch is everything else, which is what it is for:
        # a failure in `beforeAll` leaves `stack === null`, skips teardown
        # entirely, and leaves live containers that only the workflow can see --
        # including, on this job's most recent red (run 38202887580's companion
        # failure modes), a worker in a `restart: unless-stopped` loop that
        # `docker compose up --wait` reported as fine because the worker has no
        # healthcheck. `ps -a` is here for the same reason: a container that is
        # `Restarting` says more than any log line does.
        #
        # `|| true` throughout: a diagnostic step must not become a second
        # failure, and a missing compose project must not mask the one error
        # this job actually exists to report.
        run: |
          {
            echo "### docker compose ps -a"
            docker compose ps -a
            echo
            for service in postgres migrate api worker web; do
              echo "### docker compose logs $service"
              docker compose logs --no-color --timestamps --tail 500 "$service"
              echo
            done
          } > web/compose-logs.txt 2>&1 || true
          cat web/compose-logs.txt
      - name: Upload the compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-compose-logs
          path: web/compose-logs.txt
          if-no-files-found: ignore
      - name: Tear down any stack the run left behind
        if: always()
        working-directory: .
        run: docker compose down -v || true
