[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "A reliable AI operations agent for B2B support and billing — MCP tools, RAG, deterministic policy controls, human approval, tracing and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "ai-agent",
  "mcp",
  "model-context-protocol",
  "rag",
  "human-in-the-loop",
  "ai-safety",
  "llm",
  "fastapi",
  "pgvector",
  "langgraph",
  "evaluation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Office/Business",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.115",
  # Declared directly because `api/errors.py` imports `starlette.exceptions`
  # by name. Starlette arrives transitively via FastAPI, so this is not needed
  # to *run* today -- but relying on another package's dependency is how a
  # project breaks when FastAPI changes what it pins, and a direct import with
  # no declaration is the signature of that mistake. Found by
  # tests/unit/test_dependency_declarations.py, which is why that test exists.
  "starlette>=0.40",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  # pgvector supplies the SQLAlchemy `Vector` type that `knowledge_chunks.embedding`
  # is declared with. It is a *core* dependency, not an optional extra, even
  # though the SQLite test path never uses it: `models.py` imports it at module
  # scope, and a package that is missing it fails to describe its own schema.
  #
  # This was briefly wrong -- it was installed into the development venv by hand
  # while absent from this list, so the suite passed locally and a fresh
  # `pip install -e .` would have produced a package that could not declare the
  # vector column. A dependency that only the author's machine happens to have is
  # a dependency the package does not really have.
  "pgvector>=0.3",
  "mcp>=1.2",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# The provider adapters. Separate from the core so that a deployment using only
# one provider installs only one SDK -- and, more importantly, so that the core
# workflow, the whole test suite and the golden-path demo can run with NEITHER
# installed. If an SDK ever leaks into `agents/` or `domain/`, the test suite
# fails on a machine where it is absent, which is the guard this extra exists to
# provide.
openai = ["openai>=1.54"]
anthropic = ["anthropic>=0.39"]

# Real embeddings. The default embedder is a deterministic local function so a
# fresh clone and CI need no API key; this extra is what makes retrieval quality
# real, and it is not installed by default for that reason.
embeddings = ["openai>=1.54"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  # Pinned to a minor line on purpose. `ruff check` (the linter) is stable across
  # minor releases, but the *formatter* rev changes between them, so an open
  # `ruff>=0.6` means `ruff format --check` starts reporting files that were
  # formatted by whichever rev a developer happened to install. That is exactly
  # how the tree at HEAD came to have 18 files "unformatted" with a clean
  # `ruff check`: nothing changed in the code, only the formatter under it. CI
  # now runs `ruff format --check` (see .github/workflows/ci.yml), so the pin and
  # the gate hold each other: the gate fails if a file drifts, and the pin keeps
  # the definition of "formatted" from moving without a deliberate bump.
  "ruff>=0.16.10,<0.17",
  "mypy>=1.13",
  "types-requests",
  # PyYAML parses `docker-compose.yml` in
  # tests/unit/test_compose_settings_are_wired.py. The sibling guards in that
  # file hand-parse the `environment:` blocks because an undeclared parser is a
  # dependency only the author's machine has (that file's own docstring is the
  # argument, and it is still true of them). This one test genuinely needs a
  # real YAML parser -- a hand-written matcher over `ports:` lines would pass a
  # mapping it cannot parse, which is the shape of guard that reports green on
  # the thing it exists to catch -- so the package is DECLARED here rather than
  # relied upon being present.
  "pyyaml>=6.0",
  "openai>=1.54",
  "anthropic>=0.39",
  # Pillow resamples the artwork in `docs/assets/icon-source.png` into the
  # multi-size `desktop/assets/icon.ico` that the packaging configuration
  # points at and into the `web/src/app/favicon.ico` that the dashboard
  # serves, and crops the wordmark out of `docs/assets/logo-source.png`.
  # Exactly one thing imports it: the build-time tool
  # `scripts/make_assets.py`, which is run by hand when the artwork
  # changes and is not part of anything that ships. The artefacts themselves
  # are committed assets -- the shell and the installer consume the `.ico`,
  # the dashboard's browser consumes the favicon, the README consumes the
  # `.png`, and never the code that made them -- so
  # the dependency belongs to this extra and not to the core `dependencies`:
  # a deployment that installs the package should not have to install an
  # image library in order to run.
  #
  # The floor is 11.1 and not 11.0 for a reason that is about bytes rather
  # than features: Pillow changed the PNG encoder's deflate parameters
  # between 11.0.0 and 11.1.0, so an icon generated by 11.0.0 is a few
  # kilobytes smaller than the same icon generated by 11.1.0 while showing
  # exactly the same ten pictures. The decoded pixels -- what the icon looks
  # like -- are the same across every Pillow from 10.0.0 to 13.0.0, which is
  # why `make_assets.py --check` compares the pictures and not the bytes; but
  # a developer regenerating the icon on 11.0.0 would still produce a binary
  # diff nobody can read, and the tree would have no way to say why.
  "pillow>=11.1",
]

[project.scripts]
opspilot-api = "opspilot.api.__main__:main"
opspilot-worker = "opspilot.worker.__main__:main"
opspilot-eval = "opspilot.evals.__main__:main"
opspilot-seed = "opspilot.mcp_servers.seed:main"

[project.urls]
Homepage = "https://github.com/gg320324492-lgtm/OpsPilot"
Source = "https://github.com/gg320324492-lgtm/OpsPilot"
Issues = "https://github.com/gg320324492-lgtm/OpsPilot/issues"
Documentation = "https://github.com/gg320324492-lgtm/OpsPilot/blob/main/docs/architecture.md"

# WHY THE PACKAGE ROOTS ARE DECLARED AS `package-dir`, NOT A SECOND `where`
# ---------------------------------------------------------------------------
#
# `where = ["src", "mcp_servers"]` reads as "discover packages under these two
# roots", but `find` treats each entry as a *package root* -- the directory whose
# immediate children are the top-level packages. That maps `mcp_servers/crm` to
# the top-level name `crm` and never emits a `mcp_servers` package at all, so an
# installed build exposes `crm`, `billing` and `issues` as top-level names and
# nothing named `mcp_servers`.
#
# The code does not import them that way. `mcp_gateway.py:255-258` does
# `from mcp_servers._store import Store` and
# `from mcp_servers.billing import server as billing_server`, and each server
# module imports its siblings by the same dotted path
# (`mcp_servers/crm/server.py:35`). Under the `where` form those four imports
# raise `ModuleNotFoundError: No module named 'mcp_servers'`.
#
# It is invisible in development because `pythonpath = ["."]` (pytest) and a
# `cwd`-of-the-repo-root `python` session put the repository root on `sys.path`,
# where `mcp_servers/` really is a directory with `__init__.py`. In the image
# there is no such luck: the worker runs `/app/.venv/bin/opspilot-worker`, whose
# `sys.path[0]` is `/app/.venv/bin`, not `/app`. The golden path therefore died
# with `mcp_unavailable` on the first tool call, while every unit test passed.
#
# `package-dir` says the same thing without the second root: `mcp_servers` is a
# *package* that lives at the repository root, exactly as `opspilot` lives under
# `src/`. Discovery then walks `src` and `.`, and the `mcp_servers/` package --
# with its name intact -- is what gets installed.
[tool.setuptools]
package-dir = { "" = "src", "mcp_servers" = "mcp_servers" }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["opspilot*", "mcp_servers*"]

# `mcp_servers/*/seed.json` is product data, not code: each server reads it at
# startup (`_store.py::_read_document`) to populate its JSON store. setuptools
# installs only `.py` files by default, so a non-editable install ships the three
# server modules and none of their seeds, and the first tool call raises
# `StoreError: seed file not found`. It is invisible to an editable install,
# which resolves the modules back to the source tree where the JSON sits
# alongside them.
[tool.setuptools.package-data]
"mcp_servers.crm" = ["*.json"]
"mcp_servers.billing" = ["*.json"]
"mcp_servers.issues" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  # Requires a real PostgreSQL with pgvector, configured by OPSPILOT_DATABASE_URL:
  # the tests read it, connect where it names a Postgres and skip -- naming the
  # variable to set -- where it does not. No Docker locally means the normal
  # local outcome is a skip (docs/adr/0004). In CI the `verify` job sets the
  # variable and asserts these tests PASSED, so there a skip is a failure.
  "postgres: requires a real PostgreSQL with pgvector, configured by OPSPILOT_DATABASE_URL (see docs/adr/0004)",
  # Requires a real model provider and an API key. Never runs in CI's default
  # job -- `eval-live` is manual, because cost and non-determinism do not belong
  # on every push.
  "live: requires a real model provider API key",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# `scripts/` is here because `openapi_schema.py` generates the dashboard's
# types from the live schema and `demo_golden_path.py` produces the README's
# demo -- both are shipped code that CI would otherwise never look at. That is
# the same shape as the `mypy` `files` list, which sat unexecuted for the whole
# of M0-M7 because every command named a narrower path than the config did.
#
# `desktop/` is here for the same reason, and the reason is worth stating
# precisely, because it is not the reason a reader would assume. Ruff's `src`
# does not decide which files are *found*: a bare `ruff check` walks the whole
# repository recursively, minus `extend-exclude`. `src` decides which
# directories count as first-party for import resolution. The packaging tree
# is the repository's own code, so anything Python under it resolves its
# imports against the repository's own packages rather than against the
# standard library. It was listed, in the first place, for the artwork
# builder that used to live there and was linted by coincidence rather than by
# decision -- `extend-exclude` was one entry away from making it unlinted,
# silently, at exactly the moment someone started writing code under
# `desktop/`. The builder now lives in `scripts/`, where it is listed by
# decision.
src = ["src", "tests", "evals", "mcp_servers", "scripts", "desktop"]
# `docs/` holds the human-authored specification. Ruff >= 0.16 reformats fenced
# Python blocks inside Markdown, which would rewrite the spec text itself. The
# spec is an input artifact and is reviewed as prose, so it is excluded.
extend-exclude = ["docs", "apps/web"]

[tool.ruff.lint]
select = [
  "E", "F", "W",     # pycodestyle, pyflakes
  "I",               # isort
  "N",               # pep8-naming
  "UP",              # pyupgrade
  "B",               # flake8-bugbear
  "C4",              # comprehensions
  "SIM",             # simplify
  "PTH",             # pathlib over os.path
  "RUF",             # ruff-specific
  "ANN",             # annotations -- this project is typed end to end
  "ARG",             # unused arguments
  "ASYNC",           # async pitfalls
  "S",               # bandit: security
  "T20",             # no print() outside of CLI entry points
  "RET",             # return consistency
  "TID",             # tidy imports
  "PGH",             # no blanket noqa
  "TRY",             # exception handling
  "LOG",             # logging correctness
  "G",               # logging format
  "A",               # builtin shadowing
  "DTZ",             # timezone-aware datetimes -- every timestamp is UTC
]
# Rule by rule rather than a directory-wide ignore, so an exception is visible
# where it applies rather than in a central list.
ignore = [
  # The five-gate function in agents/runtime.py is deliberately long and linear:
  # it is the security-critical path, and splitting it into helpers would make
  # the order of the gates harder to verify by reading. Length in a numbered
  # sequence of gates is the point.
  "PLR0912",
  "PLR0915",
  # `assert` is used in tests and in the security invariant checks where a
  # failure should be loud and the code is not compiled with -O.
  "S101",
  # Exceptions are named for the *domain condition* they represent, not suffixed
  # with "Error". `RunParked` says the run is legitimately waiting for a human --
  # which is the workflow working, not a failure -- and `RunParkedError` would
  # suggest the opposite. Same for `IllegalTransition`, `UnknownTool` and
  # `MaxStepsExceeded`. `errors.py`'s module docstring is the argument; the rule
  # is off globally rather than per-name so a new domain exception does not need
  # a new exception to the linter.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests and the eval harness print by design: their output is the product.
"tests/**" = ["T20", "S101", "ARG001", "TRY003"]
"evals/**" = ["T20", "S101", "ARG001"]
# MCP servers are standalone processes; their entry points print.
"mcp_servers/**/__main__.py" = ["T20"]
"mcp_servers/**/server.py" = ["T20"]
# Seed and CLI entry points.
#
# TRY003 asks for long exception messages to live on the exception class rather
# than at the raise site. `WorkerConfigError` takes a `how_to_fix` argument
# precisely so the two halves of a startup failure -- what is wrong, and what to
# set -- are composed at the point the fault is known, where the detail is. The
# alternative is a class per failure mode, and the failure modes here are
# configuration values an operator changes, not conditions the code branches on.
"src/opspilot/**/__main__.py" = ["T20", "TRY003"]
"src/opspilot/mcp_servers/seed.py" = ["T20"]
"src/opspilot/evals/*.py" = ["T20"]
# The golden-path demo, whose stdout *is* the deliverable: it exists to be read
# and to be recorded into the README GIF, so routing it through logging would put
# the thing being demonstrated one layer away from the reader. T201 is the
# reason; S105 is here for the same reason it would be for any CLI -- the
# operator token is a pinned local development value so the recording is
# reproducible, and it is the same literal already committed in `.env`; S310 is
# the audit on `urllib.request`, and the URL is a `127.0.0.1` constant this file
# defines, not caller-supplied.
"scripts/demo_golden_path.py" = ["T20", "S105", "S310"]
# The live-fixture recorder prints its progress for the same reason the demo does
# -- its stdout is how a person watches a metered recording happen, and routing it
# through logging would hide it. ANN401 is the fake's case again: the wrapper takes
# a *real* provider it must not import. N806 is a local constant that names how
# many times the endpoint is retried, and reads better inside the function than at
# module scope.
"scripts/record_live_fixture.py" = ["T20", "ANN401", "N806"]
# The artwork builder is a command-line tool whose stdout *is* the deliverable:
# it reports the file it wrote and the sizes it packed into it, and that
# report is how the person running it knows the build produced what was asked
# for. The same reason as the demo and the recorder above -- routing it
# through logging would put the thing being reported one layer away from the
# reader. T201 is the reason; the tool is invoked by hand from a terminal and
# has no application whose log stream the output could be routed into.
"scripts/make_assets.py" = ["T20"]
# The provider adapters hold an SDK client typed by the SDK itself, which is
# imported inside the method (never at module scope, so the package imports
# without the extra). Its type is therefore genuinely dynamic at the annotation
# site, and `Any` is the honest annotation rather than a fabricated Protocol the
# SDK does not implement. Narrowed to the three files that touch an SDK client.
"src/opspilot/adapters/models/openai_provider.py" = ["ANN401"]
"src/opspilot/adapters/models/anthropic_provider.py" = ["ANN401"]
# The fake's recording helper takes a *real* provider it must not import (the
# fake has no provider dependency), so its parameter is dynamic by design.
"src/opspilot/adapters/models/fake.py" = ["ANN401"]
# Alembic's generated migration files are not ours to style.
"migrations/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["opspilot", "mcp_servers"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src", "mcp_servers", "tests", "evals"]

# The MCP SDK's type stubs are incomplete; the adapter that touches it is the one
# place where a narrow relaxation is granted, and it is named rather than global.
# `yaml.*` is here for the same reason and not the same cause: PyYAML ships no
# stubs, and the stubs-only distribution is not worth taking on for the one
# `safe_load()` call in the compose port-binding guard.
[[tool.mypy.overrides]]
module = ["opspilot.adapters.tools.mcp_gateway"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["langgraph.*", "mcp.*", "pgvector.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["opspilot", "mcp_servers"]
omit = [
  # Alembic's environment file is configuration, not logic.
  "migrations/*",
  # No test exercises the LangGraph adapter; `step` and `build_graph` both raise
  # NotImplementedError, so nothing is runnable through it. It is omitted from the
  # coverage number rather than covered by a mock of LangGraph, which would measure
  # the mock. `langgraph` is kept as a dependency so the module can import it when
  # it is implemented; this is the only place permitted to add that import.
  "src/opspilot/adapters/orchestration/langgraph_adapter.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
