# docker-compose.yml -- the whole OpsPilot system on one host.
#
# `docker compose up` brings up: postgres, migrate, api, worker, web.
#
# NOT VERIFIED. Docker is not installed on the machine this was written on
# (docs/adr/0004 records the same absence for the test suite's postgres marker),
# so nothing here has been through `docker compose up`, `docker compose config`
# or a build. Every command, path and entry point below was checked against the
# source that defines it, but a Compose file that has never been up is the least
# verified artefact in this repository. Treat the first run as a debugging
# session, not a smoke test.

name: opspilot

services:
  # -------------------------------------------------------------------------
  # postgres -- the store the API and worker share.
  # -------------------------------------------------------------------------
  postgres:
    # The pgvector image, not plain `postgres`. The initial migration runs
    # `CREATE EXTENSION IF NOT EXISTS vector` and declares an `hnsw` index
    # (migrations/versions/0001_initial_schema.py), and the `vector` extension
    # is not present in the official `postgres` image -- the migration would
    # fail on its first statement. The tag pins the Postgres major (16) and the
    # pgvector version, so a rerun months later resolves the same image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Published so a developer can reach the database from the host (psql, a
      # migration run outside Docker). It is a local-development convenience;
      # an operator deploying this elsewhere would remove it.
      - "5432:5432"
    healthcheck:
      # `pg_isready` ships with the image. The `-U`/`-d` are named so the check
      # proves the specific database is accepting connections, not merely that a
      # postmaster is listening. The migrate service gates on this being
      # healthy, so a false "ready" here would let migrations run against a
      # server still initialising.
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # migrate -- run the schema to head, ONCE, before anything serves.
  # -------------------------------------------------------------------------
  #
  # Migrations are a separate service, not a step in the api container's
  # entrypoint, for two reasons:
  #
  #   1. Both the api AND the worker need the schema. If the api ran migrations
  #      in its own command, a deployment that brought the worker up first (or
  #      restarted only the worker) would race an unmigrated database, and two
  #      replicas of the api would race each other running `alembic upgrade`
  #      concurrently. A one-shot service run to completion exactly once, which
  #      both others depend on, removes both races.
  #   2. `alembic upgrade head` on an already-migrated database is a no-op, but a
  #      failed migration is a hard stop. As its own service, a failure is a
  #      container that exits non-zero and blocks every dependent -- visible --
  #      rather than a crash loop inside a container the operator thought was
  #      the API.
  #
  # `service_completed_successfully` is the condition that gives this its
  # meaning: api and worker do not start until this exits 0.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      # The migration connects with the same URL the app uses. alembic.ini does
      # not hold a URL; migrations/env.py reads it from opspilot.settings, which
      # reads this environment. There is one place a deployment configures its
      # connection.
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      # The migration itself does not need the token, but the settings object
      # is constructed by migrations/env.py and settings has no token
      # requirement of its own -- only the API enforces that at startup. Given
      # here so a future migration that imports more of the app cannot fail on
      # a missing value it does not read.
      OPSPILOT_OPERATOR_TOKEN: ${OPSPILOT_OPERATOR_TOKEN:?OPSPILOT_OPERATOR_TOKEN must be set in the environment or a .env file}
    depends_on:
      postgres:
        condition: service_healthy
    # No restart policy: this is meant to run once and stay exited. A restart
    # policy would turn a failed migration into a retry loop.
    restart: "no"

  # -------------------------------------------------------------------------
  # api -- the FastAPI app under uvicorn.
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["opspilot-api"]
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      # REQUIRED, with no default. The API refuses to start without it
      # (api/auth.py::ensure_operator_token_configured). The `:?` form makes
      # Compose itself refuse to render the file when the variable is unset, so
      # the failure is "compose will not start" rather than a container that
      # exits with the token error -- a clearer message at the earlier layer.
      #
      # It is read from the environment (or a gitignored .env beside this file),
      # NEVER written here. A token in this file is a token in git, and these
      # endpoints issue refunds.
      OPSPILOT_OPERATOR_TOKEN: ${OPSPILOT_OPERATOR_TOKEN:?OPSPILOT_OPERATOR_TOKEN must be set in the environment or a .env file}
      # The dashboard is served on http://localhost:3000 by the web service.
      # CORS names exactly that origin; a wildcard is refused by the settings
      # validator (settings.py::WildcardCorsOrigin) and would, with
      # allow_credentials, be rejected by Starlette anyway. The worker gets the
      # same variable for a different reason: it serves no CORS middleware, but
      # it builds the same `Settings`, which runs that same validator -- so a
      # wildcard in .env must stop both services, not just this one.
      OPSPILOT_CORS_ORIGINS: ${OPSPILOT_CORS_ORIGINS:-http://localhost:3000}
      # Provider selection. Defaults to `fake`, which needs no key and replays
      # the recorded golden path -- the same default .env.example documents, so
      # `docker compose up` on a fresh clone runs the demo with no credentials.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_NAME: ${MODEL_NAME:-}
      # Blank unless the operator sets them; an empty key is a real
      # configuration for the fake provider and the adapters are never built
      # when MODEL_PROVIDER is not anthropic/openai.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_STRUCTURED_OUTPUT: ${ANTHROPIC_STRUCTURED_OUTPUT:-output_config}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60.0}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      # Which embedder, and at what width. `text-embedding-3-small`/`1536` are
      # OpenAI's; under EMBEDDING_PROVIDER=local they describe the lexical
      # embedder's fixed width instead. EMBEDDING_DIM is also the vector
      # column's width (models.py::_EMBEDDING_DIM reads it), so changing it
      # needs a migration -- it is forwarded, not free to retune.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # Chunks returned per query, and the score below which the run abstains.
      # Read by this service too: it owns POST /knowledge/reindex, and the
      # retrieval stack it builds shares these two with the worker
      # (adapters/wiring.py::build_retrieval_stack).
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.22}
      MAX_STEPS: ${MAX_STEPS:-24}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1.0}
      WORKER_ID: ${WORKER_ID:-}
      # Which recorded scenario the fake provider replays. The api builds no
      # provider and replays nothing, but the default is the worker's rather
      # than settings.py's empty one, because the repository's own guard
      # (tests/unit/test_compose_default_provider_has_fixtures.py) reads the
      # FIRST `OPSPILOT_FAKE_SCENARIO` default in this file and treats an empty
      # one as a deployment that cannot complete a run. An empty default here
      # would make that guard report a working stack as broken, which is the
      # same class of lie in the other direction.
      OPSPILOT_FAKE_SCENARIO: ${OPSPILOT_FAKE_SCENARIO:-duplicate_charge}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-inprocess}
      # Blank is NOT an error and NOT the same as "absent": `default_factory`
      # fills in `this interpreter -m mcp_servers.<name>.server`, and
      # mcp_gateway.py::_command_for rebuilds exactly that from "" (an empty
      # line in .env arrives as "", not as unset). So `${VAR:-}` is the value
      # that preserves the shipped behaviour.
      MCP_CRM_COMMAND: ${MCP_CRM_COMMAND:-}
      MCP_BILLING_COMMAND: ${MCP_BILLING_COMMAND:-}
      MCP_ISSUES_COMMAND: ${MCP_ISSUES_COMMAND:-}
      # Tool policy. Removes capability, never grants it (ADR-0003); blank
      # denies nothing, which is settings.py's default.
      OPSPILOT_TOOL_DENYLIST: ${OPSPILOT_TOOL_DENYLIST:-}
      OPSPILOT_REFUND_CEILING: ${OPSPILOT_REFUND_CEILING:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORE_FULL_PROMPTS: ${STORE_FULL_PROMPTS:-true}
      #
      # WHY THE WORKER-ONLY KNOBS APPEAR HERE AT ALL
      # -------------------------------------------
      # MODEL_TIMEOUT_SECONDS, MAX_STEPS, WORKER_POLL_INTERVAL, WORKER_ID,
      # OPSPILOT_FAKE_SCENARIO, MCP_TRANSPORT, MCP_*_COMMAND,
      # OPSPILOT_TOOL_DENYLIST, OPSPILOT_REFUND_CEILING and STORE_FULL_PROMPTS
      # are inert in THIS service: it issues no model call, never polls the run
      # table, builds no tool gateway and evaluates no policy. They are here
      # because both services construct the same Settings object, and a value
      # present in one service's environment and absent from the other's is a
      # deployment whose two halves disagree about its own configuration --
      # which is exactly the defect this block previously had, in reverse.
      # Two defaults deliberately differ from the worker's, each for a reason
      # stated on the line: WORKER_ID (a claimed run is the worker's to
      # attribute; the api claims none) and nothing else -- OPSPILOT_FAKE_SCENARIO
      # matches so `docker compose config` reads identically for both.
      # Bind all interfaces inside the container. The entry point defaults to
      # 127.0.0.1, which would be unreachable through a published port.
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # The in-process MCP servers write their JSON stores here; the volume
      # below makes those writes survive a container replacement. The API does
      # not itself call the tools, but it shares the image and this is where the
      # path is baked; naming it here keeps the two services symmetric.
      OPSPILOT_MCP_DATA_DIR: /data/mcp
    ports:
      - "8000:8000"
    volumes:
      # A shared volume for the MCP servers' JSON stores. The worker's gateway
      # builds the three servers in-process and they persist mutations (a refund
      # writes billing.json); without a volume, a worker restart would silently
      # reset the refund idempotency store, which is the state the
      # duplicate-refund defence consults. The api mounts the same volume so a
      # reindex on one and a read on the other see one dataset.
      - mcp-data:/data/mcp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        # THE gate that makes "migrations before serving" true. The api does not
        # start until the migration container has exited 0.
        condition: service_completed_successfully
    healthcheck:
      # KEYED ON /ready, NOT /health -- and this is load-bearing, per
      # docs/api-contract.md §7. `/health` answers whenever the process is up,
      # including one pointed at an unmigrated database; `/ready` checks the
      # database and that alembic_version is at head. A worker waiting on
      # /health would start against a schema that does not exist and fail three
      # layers down with "relation does not exist"; waiting on /ready means it
      # starts only when the database can actually serve it.
      #
      # NOTE, and it is a real limitation: nothing in the source binds a
      # readiness_check onto app.state (api/app.py), so today /ready reports
      # `{"database":"ok","migrations":"ok"}` unconditionally -- the route's
      # documented behaviour when no checker is bound (routers/health.py). The
      # probe below therefore currently proves only that the app is up. The
      # keying is still correct, and becomes the intended check the moment a
      # checker is wired.
      #
      # The check uses the stdlib app's own health route through Python's
      # urllib, because the slim image has no curl or wget. `urlopen` raises on
      # a non-2xx response, so a bare `urlopen(...).status == 200` would exit on
      # an unhandled URLError rather than on the intended status check -- hence
      # the explicit try/except: a 503 and a connection refusal both mean
      # "not ready", and both must exit non-zero *cleanly*.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;\ntry:\n    sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)\nexcept Exception:\n    sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # worker -- the poll loop that drains the run table.
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["opspilot-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot@postgres:5432/opspilot
      # The worker does not serve HTTP and does not check a token, but it builds
      # the same Settings object. Passed through for the same reason as in
      # `migrate`: one settings object, one place a value is missing.
      OPSPILOT_OPERATOR_TOKEN: ${OPSPILOT_OPERATOR_TOKEN:?OPSPILOT_OPERATOR_TOKEN must be set in the environment or a .env file}
      # The worker serves no CORS middleware and never calls `cors_origins`,
      # but it constructs the same `Settings`, which runs the same
      # `WildcardCorsOrigin` validator. So a wildcard in .env has to stop this
      # container too: an api that refuses to start on a value its worker
      # accepts is two deployments, not one.
      OPSPILOT_CORS_ORIGINS: ${OPSPILOT_CORS_ORIGINS:-http://localhost:3000}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_NAME: ${MODEL_NAME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_STRUCTURED_OUTPUT: ${ANTHROPIC_STRUCTURED_OUTPUT:-output_config}
      # Seconds one model call may take before the SDK gives up. This is the
      # setting whose absence from this file was the reason the planner looped:
      # MODEL_TIMEOUT_SECONDS was written to .env and never reached the
      # container, so the worker silently ran settings.py's default. The
      # fallback is that default (60.0) rather than a number chosen here, so
      # compose is not a second source of truth for the same knob.
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60.0}
      # Which golden-path scenario the fake provider replays. Without it, a
      # `MODEL_PROVIDER=fake` worker dies at `classifying` with
      # UnmatchedFixtureError (settings.py::fake_scenario). This default is what
      # makes `docker compose up` actually complete a run on a fresh clone.
      OPSPILOT_FAKE_SCENARIO: ${OPSPILOT_FAKE_SCENARIO:-duplicate_charge}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      # Which embedder, at what width. See the api service's note: EMBEDDING_DIM
      # is also the vector column's width and changing it needs a migration.
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # Chunks per query and the abstention threshold. The same two the api
      # reads; both services build the same retrieval stack
      # (adapters/wiring.py::build_retrieval_stack).
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.22}
      # Plan/execute rounds before the run is failed with `max_steps_exceeded`
      # (agents/runtime.py). Also unset-but-silent before this line existed: a
      # budget set in .env did not reach the loop that spends it.
      MAX_STEPS: ${MAX_STEPS:-24}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1.0}
      # Unique per worker process. A named value rather than the pid fallback,
      # so a run claimed in this deployment is attributable to *this* container
      # rather than to a bare `worker-1234` that says nothing about which host.
      WORKER_ID: ${WORKER_ID:-worker-compose}
      # Which transport the tool gateway dispatches over. This is the service
      # that reads it (worker/__main__.py::build_worker_gateway), and until this
      # line existed MCP_TRANSPORT=stdio could not be selected from a .env at
      # all -- the setting was documented, read, and unreachable from the one
      # place a deployment configures it.
      MCP_TRANSPORT: ${MCP_TRANSPORT:-inprocess}
      # Full command lines for the three servers, consulted only under
      # MCP_TRANSPORT=stdio. Blank is NOT an error and NOT the same as "absent":
      # `default_factory` fills in `this interpreter -m mcp_servers.<name>.server`
      # and mcp_gateway.py::_command_for rebuilds exactly that from "" (an empty
      # line in .env arrives as "", not as unset). `${VAR:-}` preserves the
      # shipped behaviour and lets an operator override it from .env.
      MCP_CRM_COMMAND: ${MCP_CRM_COMMAND:-}
      MCP_BILLING_COMMAND: ${MCP_BILLING_COMMAND:-}
      MCP_ISSUES_COMMAND: ${MCP_ISSUES_COMMAND:-}
      # Comma-separated tool names to refuse, and the largest refund allowed to
      # reach the approval gate. Both can only REMOVE capability, never grant it
      # (docs/adr/0003); blank denies nothing and sets no ceiling, which is
      # settings.py's default and .env.example's shipped value. The gate itself
      # (docs/risks.md R3) is code, not configuration.
      OPSPILOT_TOOL_DENYLIST: ${OPSPILOT_TOOL_DENYLIST:-}
      OPSPILOT_REFUND_CEILING: ${OPSPILOT_REFUND_CEILING:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Whether full prompts and model responses are written to agent_steps.
      # Declared so it can be set per deployment; Phase 1 ships it on and
      # production redaction is Phase 3 (docs/limitations.md).
      STORE_FULL_PROMPTS: ${STORE_FULL_PROMPTS:-true}
      # Note on what is NOT here and why: DATABASE_URL is the one setting that
      # is NOT `${...}`-templated, in every service. It names the `postgres`
      # service on the compose network, which is unreachable from a host .env --
      # an operator's `localhost:5432` is their machine, not this container.
      # Templating it would let a valid host value silently break every
      # container; the compose topology decides it.
      OPSPILOT_MCP_DATA_DIR: /data/mcp
    volumes:
      # The same store volume the api mounts. The worker is the process that
      # actually calls the tools, and billing.issue_refund persists there; the
      # refund idempotency guarantee is a property of that file, so it must
      # outlive the container.
      - mcp-data:/data/mcp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        # KEYED ON THE API'S HEALTH, WHICH IS KEYED ON /ready (see the api
        # healthcheck above). This is docs/api-contract.md §7's instruction --
        # the worker should wait for a *ready* API, never a merely live one.
        # Because the api's healthcheck is /ready, this one condition carries
        # both meanings; there is no separate /health probe to get wrong.
        condition: service_healthy
    # No healthcheck: the worker serves no HTTP endpoint, so there is nothing to
    # probe. Its liveness is its log output and its process state, which
    # `docker compose ps` reports. A TCP probe on a port it does not open would
    # be a check that always fails or a port invented to satisfy it.
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # web -- the Next.js dashboard.
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Inlined into the browser bundle at build time, deliberately: it is a
        # URL, not a credential, and the browser needs to reach the API for
        # client-side fetches. The value is the API's *published* address
        # (localhost:8000), because "localhost" in the browser means the user's
        # machine, not the compose network -- a container hostname here would be
        # unreachable from the browser.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      # READ AT RUN TIME, SERVER-SIDE ONLY. No NEXT_PUBLIC_ prefix, so it is
      # never inlined into the bundle -- web/src/lib/api/client.ts reads it in
      # Server Components and Route Handlers. This is the same operator token
      # the api checks; it must match exactly.
      OPSPILOT_OPERATOR_TOKEN: ${OPSPILOT_OPERATOR_TOKEN:?OPSPILOT_OPERATOR_TOKEN must be set in the environment or a .env file}
      # At run time the server-side fetches go straight to the api service on
      # the compose network, which resolves the service name `api`. This differs
      # from the build arg above on purpose: the browser uses the published
      # localhost URL, the server uses the internal one. When they were the same
      # value one of the two would be wrong.
      #
      # NOTE: client.ts reads NEXT_PUBLIC_API_BASE_URL for both paths today, so
      # in this configuration server-side fetches use the localhost URL too --
      # which works because the port is published. A future split (a separate
      # server-side base URL) would use this variable.
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        # The dashboard checks API reachability on load
        # (client.ts::checkApiReachability). Starting before the API is ready
        # would render the "could not reach the API" panel on first paint --
        # true for a moment, misleading as a first impression. Gating on
        # service_healthy (which is /ready) removes that.
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # THERE ARE NO MCP SERVER SERVICES HERE, AND THAT IS STILL DELIBERATE.
  # -------------------------------------------------------------------------
  #
  # This block used to say the MCP servers could not be run at all and that
  # `MCP_*_COMMAND` was dead. Both of those are fixed: the settings are now read
  # on the production path (`worker/__main__.py::build_worker_gateway` ->
  # `adapters/tools/mcp_gateway.py::build_stdio_servers_from_settings`) and spawn
  # real child processes through `adapters/tools/mcp_stdio.py`, selected by
  # `MCP_TRANSPORT=stdio` and proven by
  # `tests/integration/test_mcp_stdio_transport.py`.
  #
  # What has NOT changed -- and cannot, without making them a different kind of
  # server -- is that a stdio MCP server is a CHILD of the process that speaks to
  # it, over a pipe. Each one ends in `server.run(transport="stdio")`
  # (mcp_servers/crm/server.py::main, and its siblings). It has no port and no
  # listener, so there is nothing for a Compose healthcheck or a sibling
  # container to connect to: three services here would be three containers that
  # start, block on stdin, and serve nothing. Declaring them would be a Compose
  # file that looks like it satisfies §M9 and does not.
  #
  # So the shape is unchanged, and it is the correct shape. The three servers
  # live inside this image (src/ and mcp_servers/ are both copied in) and run
  # where they are used:
  #
  #   MCP_TRANSPORT=inprocess (the default) -- constructed inside the worker
  #       process. No process boundary. Fast and hermetic, and it covers
  #       registration, JSON Schema, structured output and the CallToolResult
  #       envelope -- everything except the pipe.
  #
  #   MCP_TRANSPORT=stdio -- the worker spawns each as a child of itself, using
  #       the MCP_*_COMMAND settings. This is the only mode that exercises stdio
  #       framing, the subprocess handshake and wire serialisation. Set it here
  #       to run the real thing:
  #
  #         worker:
  #           environment:
  #             MCP_TRANSPORT: stdio
  #
  #       The commands default to this image's own interpreter and need no
  #       override: /app is the WORKDIR and is where mcp_servers/ lives.
  #
  # The shared `mcp-data` volume is what gives their JSON stores the durability a
  # separate service would have had, and it is what makes the two transports
  # equivalent in durability: the stdio children inherit OPSPILOT_MCP_DATA_DIR
  # (the only environment variable forwarded to them), so a spawned server writes
  # the same billing.json an in-process one does.

volumes:
  # Named volumes so data survives `docker compose down` (without `-v`).
  postgres-data:
  mcp-data:
