# Alembic configuration for OpsPilot.
#
# The database URL is NOT set here on purpose: it is read at runtime from
# `opspilot.settings` (which loads .env / the environment), so there is exactly
# one place a deployment configures its connection. `migrations/env.py` supplies
# it via `sqlalchemy.url = settings.database_url`.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# One migration per milestone, never squashed during Phase 1: the migration
# history is part of the review surface (docs/data-model.md section 5).
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Add formatters here if generated migrations ever need it. Ruff is configured
# to skip `migrations/**` entirely, so no hook is wired up by default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
