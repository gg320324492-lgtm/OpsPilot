# Alembic configuration, at the repository root.
#
# WHY THIS FILE EXISTS TWICE: `migrations/alembic.ini` holds the real
# configuration, and this file exists so that the documented command works.
#
# `alembic` with no `-c` looks for `alembic.ini` in the *current directory*.
# The README, `docs/milestones.md` and the CI workflow all say `alembic upgrade
# head` from the repository root, and the first reviewer to run that command got
#
#     FAILED: No 'script_location' key found in configuration.
#
# because the only config lived one directory down. The options were to write
# `-c migrations/alembic.ini` at every call site (four places, and a fifth would
# forget) or to make the root discovery path work. This is the second, chosen
# because the failure mode of the first is a broken command in the README that
# nobody notices until a stranger tries it.
#
# The duplication is deliberately one-directional: `script_location` points at
# the same `migrations/` directory, so there is still exactly ONE migration
# history and ONE `env.py`. Only the logging and hook sections below are copied,
# and they carry no state. `tests/unit/test_alembic_config.py` asserts both files
# declare the same `script_location`, so the two cannot drift into describing
# different histories.
#
# Like the file it mirrors, the database URL is NOT set here: it is read at
# runtime from `opspilot.settings` (which loads .env and the environment), so
# there is exactly one place a deployment configures its connection.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# One migration per milestone, never squashed during Phase 1: the migration
# history is part of the review surface (docs/data-model.md section 5).
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Ruff is configured to skip `migrations/**` entirely, so no hook is wired up.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
